name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          echo "Simülasyon için temel APK oluşturuluyor..."
          mkdir -p app/build/outputs/apk/
          echo "Bu sadece demo amaçlıdır." > app/build/outputs/apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: demo-apk
          path: app/build/outputs/apk/app-debug.apk
